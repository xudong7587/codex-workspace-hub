services:
  workspace-hub:
    image: ghcr.io/xudong7587/codex-workspace-hub:latest
    pull_policy: always
    restart: unless-stopped
    init: true

    environment:
      HOST: 0.0.0.0
      PORT: 17321
      POLL_INTERVAL_SECONDS: 300
      MANUAL_REFRESH_COOLDOWN_MS: 5000
      STALE_AFTER_SECONDS: 900
      LOG_LEVEL: info
      TZ: Asia/Shanghai
      PUID: "1000"
      PGID: "10"

    ports:
      - "17321:17321"

    volumes:
      - hub-data:/data
      - ./cw-snapshots:/data/development-snapshots

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16777216,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    stop_grace_period: 75s

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -T
        - "5"
        - -O
        - /dev/null
        - http://127.0.0.1:17321/livez
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  hub-data:
